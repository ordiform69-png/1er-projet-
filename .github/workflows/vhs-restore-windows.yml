# VHS Restore AI : tests et fabrication de l'application sur une vraie machine Windows.
# Ne concerne que le dossier vhs-restore-ai/ (le reste du dépôt n'est pas touché).
# Résultat téléchargeable dans l'onglet « Actions » du dépôt : artefact « VHSRestoreAI-Windows ».
name: VHS Restore AI (Windows)

on:
  push:
    paths:
      - "vhs-restore-ai/**"
      - ".github/workflows/vhs-restore-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: vhs-restore-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances Python
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -r requirements-poussieres.txt -r requirements-couleurs.txt pyinstaller==6.22.3

      - name: FFmpeg et modèle de colorisation (même script que l'installation utilisateur)
        run: ./scripts/installer_outils.ps1 -AvecCouleurs

      - name: Tests automatiques
        id: tests
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $env:PATH = "$PWD\tools\ffmpeg\bin;$env:PATH"
          $env:VHSRA_DDCOLOR = "$PWD\tools\ddcolor\ddcolor-tiny-fp16.onnx"
          python -m pytest -q -rfE tests -o faulthandler_timeout=900

      - name: Fabrication de l'application
        run: pyinstaller --noconfirm VHSRestoreAI.spec

      - name: Ajout de FFmpeg et du mode d'emploi
        run: |
          New-Item -ItemType Directory -Force dist/VHSRestoreAI/tools/ffmpeg/bin | Out-Null
          Copy-Item tools/ffmpeg/bin/ffmpeg.exe, tools/ffmpeg/bin/ffprobe.exe dist/VHSRestoreAI/tools/ffmpeg/bin/
          Copy-Item tools/ffmpeg/LICENSE* dist/VHSRestoreAI/tools/ffmpeg/ -ErrorAction SilentlyContinue
          Copy-Item LISEZMOI.txt dist/VHSRestoreAI/
          New-Item -ItemType Directory -Force dist/VHSRestoreAI/licences | Out-Null
          New-Item -ItemType Directory -Force dist/VHSRestoreAI/tools/ddcolor | Out-Null
          Copy-Item tools/ddcolor/ddcolor-tiny-fp16.onnx dist/VHSRestoreAI/tools/ddcolor/
          Copy-Item vhs_restore/models/DDCOLOR-LICENSE.txt dist/VHSRestoreAI/licences/
          python -c "import importlib.metadata as m; d=m.distribution('analog-repair'); f=[p for p in d.files if 'LICENSE' in p.name.upper()]; open('dist/VHSRestoreAI/licences/analog-repair-LICENSE.txt','w',encoding='utf-8').write(f[0].read_text(encoding='utf-8') if f else 'MIT - https://github.com/Bratwurstexe/ANALOG_REPAIR')"

      - name: Autotest de l'application fabriquée (sans Python ni FFmpeg du système)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "autotest été"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath dist/VHSRestoreAI/VHSRestoreAI.exe -ArgumentList "--autotest", "`"$dir`"" -Wait -PassThru
          Get-Content (Join-Path $dir "autotest.txt") -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Autotest en échec (code $($p.ExitCode))" }

      - name: Préparer le paquet vérifié
        if: success() && steps.tests.outcome == 'success'
        run: |
          $nom = "VHSRestoreAI-Windows-${{ github.run_number }}-${{ github.sha }}"
          New-Item -ItemType Directory -Force livraison | Out-Null
          Compress-Archive dist/VHSRestoreAI "livraison/$nom.zip"
          $sha = (Get-FileHash "livraison/$nom.zip" -Algorithm SHA256).Hash
          "$sha  $nom.zip" | Set-Content "livraison/$nom.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        if: success() && steps.tests.outcome == 'success'
        with:
          name: VHSRestoreAI-Windows-${{ github.run_number }}-${{ github.sha }}
          path: vhs-restore-ai/livraison
          retention-days: 90

      - name: Bilan des tests
        if: steps.tests.outcome != 'success'
        run: throw "Des tests automatiques ont échoué (voir l'étape « Tests automatiques »)."
