# Diagnostic TEMPORAIRE (4) : l'encodeur AAC de FFmpeg 9.1 (Windows) se fige sur un bip suivi de silence ;
# silence pur et sinus continu passent. Quel réglage évite le blocage ? 30 s au plus chacun. À retirer.
name: Diagnostic FFmpeg (temporaire)

on:
  push:
    branches: ["ccr-5856e8d6-8xt8uh"]
    paths:
      - ".github/workflows/diagnostic-ffmpeg.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vhs-restore-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg (même script que la fabrication)
        shell: pwsh
        run: ./scripts/installer_outils.ps1
      - name: Variantes du son
        shell: python
        run: |
          import os, subprocess, time
          ff = os.path.abspath(os.path.join("tools", "ffmpeg", "bin", "ffmpeg.exe"))
          print(subprocess.run([ff, "-hide_banner", "-version"], capture_output=True, text=True).stdout.splitlines()[0], flush=True)
          def essai(nom, entree, son, limite=45):
              out = os.path.abspath(f"diag-{abs(hash(nom))}.mp4")
              cmd = [ff, "-hide_banner", "-nostdin", "-y", "-loglevel", "warning", *entree, "-t", "2",
                     "-c:v", "libx264", "-preset", "medium", "-crf", "18", "-pix_fmt", "yuv420p", *son, "-f", "mp4", out]
              t0 = time.time()
              p = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              try:
                  _, e = p.communicate(timeout=limite)
                  etat = f"fini, code {p.returncode}"
              except subprocess.TimeoutExpired:
                  p.kill()
                  _, e = p.communicate()
                  etat = f"BLOQUÉ (arrêté à {limite} s)"
              taille = os.path.getsize(out) if os.path.exists(out) else -1
              print(f"{nom:52s} : {etat} en {time.time() - t0:5.1f} s ; sortie {taille} octets ; {e.decode('utf-8', 'replace')[-160:]!r}", flush=True)
          img = ["-f", "lavfi", "-i", "color=black:s=128x96:r=25:d=2"]
          silence_mono = ["-f", "lavfi", "-i", "anullsrc=r=48000:cl=mono"]
          silence_stereo = ["-f", "lavfi", "-i", "anullsrc=r=48000:cl=stereo"]
          sinus_mono = ["-f", "lavfi", "-i", "sine=f=440:r=48000"]
          bip_mono = ["-f", "lavfi", "-i", "aevalsrc='0.5*sin(2*PI*440*t)*between(t,0.6,0.68)':s=48000"]
          bip_bruit = ["-f", "lavfi", "-i", "aevalsrc='0.5*sin(2*PI*440*t)*between(t,0.6,0.68)+0.0005*(random(0)-0.5)':s=48000"]
          a = ["-c:a", "aac"]
          essai("bip mono 192k (référence)", [*img, *bip_mono], [*a, "-b:a", "192k"], 30)
          essai("bip mono 192k -aac_coder fast", [*img, *bip_mono], [*a, "-b:a", "192k", "-aac_coder", "fast"], 30)
          essai("bip mono 192k -aac_pns 0", [*img, *bip_mono], [*a, "-b:a", "192k", "-aac_pns", "0"], 30)
          essai("bip mono 192k -aac_tns 0", [*img, *bip_mono], [*a, "-b:a", "192k", "-aac_tns", "0"], 30)
          essai("bip mono 128k", [*img, *bip_mono], [*a, "-b:a", "128k"], 30)
          essai("bip mono 96k", [*img, *bip_mono], [*a, "-b:a", "96k"], 30)
          essai("bip mono -q:a 2 (débit variable)", [*img, *bip_mono], [*a, "-q:a", "2"], 30)
          essai("bip stéréo 192k", [*img, *bip_mono], [*a, "-b:a", "192k", "-ac", "2"], 30)
          essai("bip stéréo 192k -aac_coder fast", [*img, *bip_mono], [*a, "-b:a", "192k", "-ac", "2", "-aac_coder", "fast"], 30)
          essai("bip stéréo 96k -aac_coder fast", [*img, *bip_mono], [*a, "-b:a", "96k", "-ac", "2", "-aac_coder", "fast"], 30)
          essai("bip + souffle -66 dB, mono 192k", [*img, *bip_bruit], [*a, "-b:a", "192k"], 30)
