# Diagnostic TEMPORAIRE : pourquoi l'export d'un morceau ne se termine pas avec FFmpeg 9.1 (Windows).
# Lance la commande bloquante et quelques variantes, chacune limitée à 90 s. À retirer ensuite.
name: Diagnostic FFmpeg (temporaire)

on:
  push:
    branches: ["ccr-5856e8d6-8xt8uh"]
    paths:
      - ".github/workflows/diagnostic-ffmpeg.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vhs-restore-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg (même script que la fabrication)
        shell: pwsh
        run: ./scripts/installer_outils.ps1
      - name: Variantes de la commande d'un morceau
        shell: python
        run: |
          import os, subprocess, time
          ff = os.path.abspath(os.path.join("tools", "ffmpeg", "bin", "ffmpeg.exe"))
          fp = os.path.abspath(os.path.join("tools", "ffmpeg", "bin", "ffprobe.exe"))
          print(subprocess.run([ff, "-hide_banner", "-version"], capture_output=True, text=True).stdout.splitlines()[0])
          src = os.path.abspath("clap.mkv")
          bips = [t - 0.4 for t in (1, 5)]
          signal = "+".join(f"between(t,{t},{t + 0.08})" for t in bips)
          subprocess.run([ff, "-v", "error", "-y", "-f", "lavfi", "-i",
                          "color=black:s=128x96:r=25:d=6,drawbox=color=white:t=fill:enable='eq(n,25)+eq(n,125)'",
                          "-f", "lavfi", "-i", f"aevalsrc='0.5*sin(2*PI*440*t)*({signal})':s=48000:d=6",
                          "-c:v", "ffv1", "-c:a", "flac", src], check=True)
          un = ["-t", "2.000", "-i", src, "-t", "1.600", "-i", src]
          deux = ["-ss", "4.000", "-t", "2.000", "-i", src, "-ss", "3.600", "-t", "2.000", "-i", src]
          enc = ["-map", "0:v:0", "-map", "1:a:0", "-vf", "hqdn3d=1.5:3:2:4,setsar=1/1,format=yuv420p",
                 "-c:v", "libx264", "-preset", "medium", "-crf", "18", "-pix_fmt", "yuv420p",
                 "-c:a", "aac", "-b:a", "192k", "-movflags", "+faststart"]
          d = "2.000000000"
          variantes = [
              ("morceau 1, commande actuelle", un, f"adelay=400:all=1,apad,atrim=duration={d}", ["-frames:v", "50"]),
              ("morceau 1, sans -frames:v", un, f"adelay=400:all=1,apad,atrim=duration={d}", []),
              ("morceau 1, apad=whole_dur", un, f"adelay=400:all=1,apad=whole_dur={d},atrim=duration={d}", ["-frames:v", "50"]),
              ("morceau 1, sans apad", un, f"adelay=400:all=1,atrim=duration={d}", ["-frames:v", "50"]),
              ("morceau 1, -t sortie", un, f"adelay=400:all=1,apad,atrim=duration={d}", ["-frames:v", "50", "-t", "2.000"]),
              ("morceau 2, commande actuelle", deux, f"apad,atrim=duration={d}", ["-frames:v", "50"]),
              ("morceau 2, sans -frames:v", deux, f"apad,atrim=duration={d}", []),
              ("morceau 2, apad=whole_dur", deux, f"apad=whole_dur={d},atrim=duration={d}", ["-frames:v", "50"]),
          ]
          for i, (nom, entrees, af, lim) in enumerate(variantes):
              out = os.path.abspath(f"diag-{i}.mp4")
              cmd = [ff, "-hide_banner", "-nostdin", "-y", "-loglevel", "warning", "-progress", "pipe:1", "-nostats",
                     *entrees, *enc, "-af", af, *lim, "-f", "mp4", out]
              t0 = time.time()
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=90)
                  etat, err = f"fini, code {r.returncode}", r.stderr[-200:]
              except subprocess.TimeoutExpired as e:
                  etat, err = "BLOQUÉ (arrêté à 90 s)", ""
              mesure = ""
              if os.path.exists(out) and os.path.getsize(out) > 0:
                  p = subprocess.run([fp, "-v", "error", "-count_frames", "-show_entries",
                                      "stream=codec_type,nb_read_frames,duration", "-of", "csv=p=0", out],
                                     capture_output=True, text=True, timeout=60)
                  mesure = p.stdout.replace("\n", " | ").strip()
              print(f"{nom:32s} : {etat} en {time.time() - t0:5.1f} s ; {mesure} ; {err!r}", flush=True)
